name: Deploy to Production

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ecommerce
        run: npm ci && npm run build

      - name: Upload Frontend to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "ecommerce/dist/*"
          target: "/var/www/ecommerce/"
          strip_components: 2

      - name: Deploy Backend & Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/Do_An_Tot_Nghiep
            git pull origin dev
            CHANGED=$(git diff HEAD~1 HEAD --name-only | grep "ecommerce-backend" | wc -l)
            if [ "$CHANGED" -gt "0" ]; then
              cd ecommerce-backend
              docker compose down && docker compose up -d --build
              sleep 30
            fi
            sudo chmod -R 755 /var/www/ecommerce
            sudo find /var/www/ecommerce -type f -exec chmod 644 {} \;
            sudo systemctl reload nginx
            echo "Deploy xong!"