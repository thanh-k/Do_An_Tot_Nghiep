name: Deploy to Production

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout code
        uses: actions/checkout@v5

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ecommerce/package-lock.json

      # Build frontend
      - name: Build Frontend
        working-directory: ecommerce
        run: |
          npm ci
          npm run build

      # Upload frontend dist lên server
      - name: Upload Frontend to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "ecommerce/dist/*"
          target: "/var/www/ecommerce/"
          strip_components: 2
          timeout: 120s

      # Deploy backend nếu backend thay đổi
      - name: Deploy Backend & Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/Do_An_Tot_Nghiep

            # Pull code mới
            git pull origin dev

            # Kiểm tra backend có thay đổi không
            CHANGED=$(git diff HEAD~1 HEAD --name-only | grep "ecommerce-backend" | wc -l)

            if [ "$CHANGED" -gt "0" ]; then
              echo "Backend changed → rebuilding Docker"

              cd ecommerce-backend

              docker compose down
              docker compose up -d --build

              echo "Waiting backend startup..."
              sleep 30
            fi

            # Fix permissions
            sudo chmod -R 755 /var/www/ecommerce
            sudo find /var/www/ecommerce -type f -exec chmod 644 {} \;

            # Reload nginx
            sudo systemctl reload nginx

            echo "✅ Deploy completed!"