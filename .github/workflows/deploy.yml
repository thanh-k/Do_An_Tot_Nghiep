name: Deploy to Production

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: ecommerce
        run: npm ci

      - name: Build Frontend
        working-directory: ecommerce
        run: npm run build

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH config
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.SERVER_HOST }}
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Test SSH Connection
        run: |
          ssh ${{ secrets.SERVER_HOST }} "echo 'SSH OK' && whoami"

      - name: Upload Frontend to Server
        run: |
          scp -r ecommerce/dist/* \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/ecommerce-dist/

      - name: Deploy Backend & Reload Nginx
        run: |
          ssh ${{ secrets.SERVER_HOST }} << 'ENDSSH'
            cd ~/Do_An_Tot_Nghiep
            git pull origin dev
            sudo mkdir -p /var/www/ecommerce
            sudo rm -rf /var/www/ecommerce/*
            sudo cp -r /tmp/ecommerce-dist/* /var/www/ecommerce/
            CHANGED=$(git diff HEAD~1 HEAD --name-only | grep "ecommerce-backend" | wc -l)
            if [ "$CHANGED" -gt "0" ]; then
              cd ecommerce-backend
              docker compose down && docker compose up -d --build
              sleep 30
            fi
            sudo chmod -R 755 /var/www/ecommerce
            sudo find /var/www/ecommerce -type f -exec chmod 644 {} \;
            sudo systemctl reload nginx
            echo "Deploy xong!"
          ENDSSH