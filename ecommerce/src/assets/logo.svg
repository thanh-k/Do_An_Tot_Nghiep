<svg width="450" height="120" viewBox="0 0 450 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient vàng hoàng gia sang trọng cho Icon -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <!-- Đổ bóng nhẹ tạo độ nổi khối chuyên nghiệp -->
    <filter id="premiumShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Icon tròn vuông bo góc với Gradient Vàng Gold quý phái -->
  <rect x="10" y="20" width="80" height="80" rx="24" fill="url(#goldGrad)" filter="url(#premiumShadow)"/>
  
  <!-- Chữ viết tắt thương hiệu PHT màu trắng tinh khôi có độ nổi khối -->
  <text x="50" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5" filter="url(#premiumShadow)">PHT</text>
  
  <!-- Chữ "Insight" màu trắng tinh tế, được dời sang x=130 để tránh bị dính chữ I khi crop trên mobile -->
  <text x="130" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Insight</text>
  
  <!-- Chữ "Shop" màu vàng gold ấm áp tạo điểm nhấn thương hiệu cao cấp, dời tương ứng sang x=292 -->
  <text x="292" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="900" fill="#FFC107" letter-spacing="-0.5">Shop</text>
</svg>
